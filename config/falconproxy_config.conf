# VPSManagerPRO config written by install_falcon_proxy() in the menu.
# PORTS MUST be a comma-separated list — the falconproxy binary's -p/--ports
# flag consumes ONE value (value_delimiter=','), then a positional `host`
# argument. Writing space-separated ports ("8080 8888") makes the binary
# treat "8888" as the bind host and the proxy fails to start / does nothing.

PORTS="8080,8888"
INSTALLED_VERSION="bundled"