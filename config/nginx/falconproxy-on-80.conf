# Falcon Proxy on public :80 — through nginx (both coexist, nobody stops anyone)
#
# falconproxy cannot share port 80 with nginx directly: it is a compiled
# binary with no SO_REUSEPORT, so the two processes cannot both bind :80.
# Instead of binding the proxy on 80 (which forces a web server down), let
# nginx KEEP port 80 and forward the proxy traffic:
#
#     payload client -> server:80 (nginx) --WS upgrade--> 127.0.0.1:8080 (falconproxy)
#
# The proxy is therefore reachable "on port 80" from the client's point of
# view, while nginx still owns :80 for certbot HTTP-01 challenges and any
# regular HTTP vhosts.
#
# Deploy:
#   cp falconproxy-on-80.conf /etc/nginx/sites-available/falconproxy-on-80
#   ln -sf /etc/nginx/sites-available/falconproxy-on-80 /etc/nginx/sites-enabled/falconproxy-on-80
#   rm -f /etc/nginx/sites-enabled/default          # avoid default_server clash
#   nginx -t && systemctl reload nginx
#
# The patched menu writes this automatically (install_falcon_proxy -> choose
# option 1 when it detects a web server on port 80).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;
    server_name _;

    # Let's Encrypt HTTP-01 challenges stay local so certbot keeps working on :80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Everything else is Falcon Proxy traffic (autossh / WS payloaders):
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}