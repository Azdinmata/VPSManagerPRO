# VPSManagerPRO edge stack — HAProxy (reference template).
#
# Deployed by the menu "configure_edge_stack" flow to /etc/haproxy/haproxy.cfg.
# Public ports 80/443 terminate traffic and route by L4 detection:
#   * raw SSH  -> direct to 127.0.0.1:22
#   * plain HTTP/WS -> nginx 127.0.0.1:8880
#   * TLS with web ALPN -> nginx 127.0.0.1:8443
#   * any other TLS (Any-SNI SSH) -> loopback terminator 127.0.0.1:10443,
#     which decrypts and redispatches to SSH/nginx-8880.
#
# TLS cert for the internal terminator: /etc/vpsmanagerpro/ssl/vpsmanagerpro.pem
# (bundled crt+key, generated by install.sh).

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  24h
    timeout server  24h

# ====================================================================
# TIER 1: PORT 80 (Cleartext Payloads & Raw SSH)
# ====================================================================
frontend port_80_edge
    bind *:80
    mode tcp
    tcp-request inspect-delay 2s

    acl is_ssh payload(0,7) -m bin 5353482d322e30

    tcp-request content accept if is_ssh
    tcp-request content accept if HTTP

    use_backend direct_ssh if is_ssh
    default_backend nginx_cleartext

# ====================================================================
# TIER 1: PORT 443 (TLS v2ray, SSL Payloads, Raw SSH)
# ====================================================================
frontend port_443_edge
    bind *:443
    mode tcp
    tcp-request inspect-delay 2s

    acl is_ssh payload(0,7) -m bin 5353482d322e30
    acl is_tls req.ssl_hello_type 1
    acl has_web_alpn req.ssl_alpn -m sub h2 http/1.1

    tcp-request content accept if is_ssh
    tcp-request content accept if HTTP
    tcp-request content accept if is_tls

    use_backend direct_ssh if is_ssh
    use_backend nginx_cleartext if HTTP
    use_backend nginx_tls if is_tls has_web_alpn
    default_backend loopback_ssl_terminator

# ====================================================================
# TIER 2: INTERNAL DECRYPTOR (Only for Any-SNI SSH-TLS)
# ====================================================================
frontend internal_decryptor
    bind 127.0.0.1:10443 ssl crt /etc/vpsmanagerpro/ssl/vpsmanagerpro.pem
    mode tcp
    tcp-request inspect-delay 2s

    acl is_ssh payload(0,7) -m bin 5353482d322e30
    tcp-request content accept if is_ssh
    tcp-request content accept if HTTP

    use_backend direct_ssh if is_ssh
    default_backend nginx_cleartext

# ====================================================================
# DESTINATION BACKENDS (Clean handoffs, no proxy headers)
# ====================================================================
backend direct_ssh
    mode tcp
    server ssh_server 127.0.0.1:22

backend nginx_cleartext
    mode tcp
    server nginx_8880 127.0.0.1:8880

backend nginx_tls
    mode tcp
    server nginx_8443 127.0.0.1:8443

backend loopback_ssl_terminator
    mode tcp
    server haproxy_ssl 127.0.0.1:10443